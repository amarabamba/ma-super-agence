[PHP]
; Application-level limits (Vich uploads: 2MB default, we allow 8MB)
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 10M
realpath_cache_size = 4096K
realpath_cache_ttl = 600
expose_php = Off

; Log errors to stderr so they show up in the container logs
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off

[opcache]
opcache.enable = 1
; php -S needs the CLI SAPI accelerated as well
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M