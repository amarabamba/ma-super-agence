# Démarrage en UN SEUL conteneur : application Symfony + MySQL (MariaDB, drop-in
# MySQL 8 pour ce projet) dans la même image.
#
#   docker compose up --build
#   → http://127.0.0.1:8080   (migrations + fixtures de démo si base vide)

services:
  app:
    build:
      context: .
      target: standalone
    image: masuperagence:standalone
    container_name: masuperagence
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # APP_ENV=prod : assets buildés dans l'image, comportement "production-like"
      # comme en déploiement Render. Les variables réelles priment sur le .env commité.
      APP_ENV: prod
      APP_DEBUG: 0
      # Secret de DÉVELOPPEMENT uniquement (= valeur du .env commité). Jamais de secret prod ici.
      APP_SECRET: 2dad102e282510f2b5ca6499bbad87fd
      # MySQL tourne dans le conteneur lui-même (127.0.0.1:3306).
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/masuperagence
      MAILER_DSN: null://null
      MYSQL_DATABASE: masuperagence
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      # Fixtures : "auto" charge la démo (100 biens + admin demo/demo) si la base est vide.
      # "1" recharge à chaque démarrage, "0" ne charge jamais.
      LOAD_FIXTURES: auto
    volumes:
      # La base persiste entre deux démarrages de conteneur.
      - db_data:/var/lib/mysql

volumes:
  db_data: