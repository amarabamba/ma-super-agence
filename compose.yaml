# COMPOSE UNIQUEMENT POUR LE DEV LOCAL.
#
# Le service `app` construit la cible `standalone` (le stage `production` est
# construit en amont mais PAS utilisé). MariaDB vit ici comme service
# séparé : il n'est JAMAIS embarqué dans l'image Symfony de production.
#
# Commandes :
#   docker compose up --build   # démarre db + app (fixtures auto si base vide)
#   docker compose down -v      # arrête et supprime le volume de la base

name: ma-super-agence

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-masuperagence}
      MARIADB_USER: ${MYSQL_USER:-app}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-app}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      target: standalone
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:-2dad102e282510f2b5ca6499bbad87fd}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@db:3306/${MYSQL_DATABASE:-masuperagence}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      LOAD_FIXTURES: ${LOAD_FIXTURES:-auto}
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db_data: